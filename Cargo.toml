# Root virtual workspace — HOST crates only (build on stable Rust).
#
# Device firmware lives under fw/ with its own toolchain (rustup `esp` channel)
# and is EXCLUDED from this workspace. Build device crates by cd-ing into them
# (their rust-toolchain.toml + .cargo/config.toml select the Xtensa target).
# See README.md and docs/adr/2026-07-28-license-provenance-discipline.md.
[workspace]
resolver = "2"
members = [
    "xt-runner-proto",
    "xt-runner-client",
    # more host crates land here as milestones add them:
    # "lp-xt-inst", "lp-xt-emu", "lp-xt-elf", "xt-mini-emit"
]
exclude = ["fw", "oss"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/PhotomancerArt/2026-esp32s3-experiment"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
