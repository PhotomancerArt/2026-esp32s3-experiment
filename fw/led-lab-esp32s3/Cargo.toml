# Own workspace root: fw/ is excluded from the repo-root workspace and this
# crate carries its own Cargo.lock. Without this, a git worktree checked out
# under <repo>/.claude/worktrees/<name>/ makes Cargo walk past the worktree
# root manifest (which excludes fw/) into the OUTER checkout's Cargo.toml,
# which neither includes nor excludes this path — "current package believes
# it's in a workspace when it's not".
[workspace]

[package]
edition      = "2021"
name         = "led-lab-esp32s3"
license      = "MIT"
rust-version = "1.86"
version      = "0.1.0"

[[bin]]
name = "led-lab-esp32s3"
path = "src/main.rs"

[features]
# P3's on-device self-test: route TX GPIO4 into RMT RX channel 4 through the
# GPIO matrix (no wire) and assert timing + decoded bytes numerically. Replaces
# the demo main loop; the demo build is unchanged without this feature.
test_loopback = ["lp-ws281x/test_hooks"]
# P6's stress harness: four channels of long strips at maximum frame rate while
# escalating load runs beside them (S0 idle, S1 logging, S2 WiFi scan loop, S3
# ESP-NOW broadcast spam, S4 STA+UDP if an AP is configured). The radio stack
# and its scheduler/allocator are pulled in **only** here, so the demo and
# loopback builds stay radio-free.
test_stress = [
  "dep:esp-rtos",
  "dep:esp-radio",
  "dep:esp-alloc",
  "dep:embassy-futures",
]

[dependencies]
embassy-futures        = { version = "0.1.2", optional = true }
esp-alloc              = { version = "0.10.0", optional = true, features = ["esp32s3"] }
esp-radio              = { version = "0.18.0", optional = true, features = [
  "esp32s3",
  "wifi",
  "esp-now",
  "esp-alloc",
  "unstable",
] }
esp-rtos               = { version = "0.3.0", optional = true, features = [
  "esp32s3",
  "esp-radio",
  "esp-alloc",
] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3"] }
esp-hal                = { version = "1.1.1", features = ["esp32s3", "unstable"] }
esp-println            = { version = "0.17.0", default-features = false, features = [
  "esp32s3",
  "jtag-serial",
] }

# The portable driver core. `default-features = false` drops the host-only
# `mock` backend (which needs `alloc`).
lp-ws281x = { path = "../../lp-ws281x", default-features = false }

[profile.dev]
# Rust debug is too slow for a driver that refills a buffer every 30 us.
opt-level = "s"

[profile.release]
codegen-units    = 1
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false
