# Own workspace root: fw/ is excluded from the repo-root workspace and this
# crate carries its own Cargo.lock. Without this, a git worktree checked out
# under <repo>/.claude/worktrees/<name>/ makes Cargo walk past the worktree
# root manifest (which excludes fw/) into the OUTER checkout's Cargo.toml,
# which neither includes nor excludes this path — "current package believes
# it's in a workspace when it's not".
[workspace]

[package]
edition      = "2021"
name         = "led-lab-esp32"
license      = "MIT"
rust-version = "1.86"
version      = "0.1.0"

[[bin]]
name = "led-lab-esp32"
path = "src/main.rs"

[features]
# P5's on-device self-test for the classic ESP32: route the TX GPIOs into RMT
# RX channels through the GPIO matrix (no wire) and assert timing + decoded
# bytes numerically. Replaces the demo main loop; the demo build is unchanged
# without this feature.
test_loopback = ["lp-ws281x/test_hooks"]
# All-eight-channels TX soak: every RMT channel transmits (no receivers left to
# assert the wire), guard-trip/error counters are the pass signal. Covers the
# fan-out the 4 TX + 4 RX loopback cannot (a channel is TX-or-RX, not both).
soak_8tx = []
# Diagnostic build for the open concurrent-soak finding: a matrix of
# TX/RX-count, pin, RX-mapping and start-stagger configurations plus a CPU
# `GPIO_IN` wire witness that does not go through the RMT receiver at all.
# Prints `D5: MEASURE` lines only — it asserts nothing and replaces neither
# suite. See `src/diag.rs`.
diag = []
# P6's channel-count sweep: walks 1..8 TX channels × two strip lengths and
# prints one machine-readable line per cell (guard trips, lag_max against the
# 32-word deadline, lag histogram, aggregate refill-interrupt rate). TX-only
# and receiver-free by construction — P5 root-caused that arming two or more
# RMT receivers corrupts a concurrent transmitter's pad output on this chip.
# See `src/sweep.rs`.
sweep_channels = []
# P6's stress harness: four channels of long strips at maximum frame rate while
# escalating load runs beside them (S0 idle, S1 logging, S2 WiFi scan loop, S3
# ESP-NOW broadcast spam, S4 STA+traffic if an AP is configured). The radio
# stack and its scheduler/allocator are pulled in **only** here, so every other
# build of this crate stays radio-free — which matters on a 4 MB classic ESP32,
# where the radio blob costs ~500 KB of flash. See `src/stress.rs`.
test_stress = [
  "dep:esp-rtos",
  "dep:esp-radio",
  "dep:esp-alloc",
]

[dependencies]
esp-alloc              = { version = "0.10.0", optional = true, features = ["esp32"] }
esp-radio              = { version = "0.18.0", optional = true, features = [
  "esp32",
  "wifi",
  "esp-now",
  "esp-alloc",
  "unstable",
] }
esp-rtos               = { version = "0.3.0", optional = true, features = [
  "esp32",
  "esp-radio",
  "esp-alloc",
] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32"] }
esp-hal                = { version = "1.1.1", features = ["esp32", "unstable"] }
# Classic ESP32 has no UsbSerialJtag: println goes out over UART0 through the
# board's USB-UART bridge (which also means no port re-enumeration on reset).
esp-println            = { version = "0.17.0", default-features = false, features = [
  "esp32",
  "uart",
] }

# The portable driver core. `default-features = false` drops the host-only
# `mock` backend (which needs `alloc`).
lp-ws281x = { path = "../../lp-ws281x", default-features = false }

[profile.dev]
# Rust debug is too slow for a driver that refills a buffer every ~40 us.
opt-level = "s"

[profile.release]
codegen-units    = 1
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false
