[package]
name = "xt-runner-esp32s3"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.86"

[[bin]]
name = "xt-runner-esp32s3"
path = "src/main.rs"

[dependencies]
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3"] }
esp-hal = { version = "1.1.1", features = ["esp32s3", "log-04", "unstable"] }

critical-section = "1.2.0"
esp-alloc = { version = "0.10.0", features = ["internal-heap-stats"] }
xt-runner-core = { path = "../../xt-runner-core" }
xt-runner-proto = { path = "../../xt-runner-proto" }

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units    = 1
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false
