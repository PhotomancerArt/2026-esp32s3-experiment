[package]
name = "lp-xt-elf"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Xtensa linked-ELF loader + guest-syscall host for lp-xt-emu."

[lints]
workspace = true

[features]
# M6 stretch prototype: relocatable-object (.o) parsing, a minimal two-object
# linker driver, and R_XTENSA_32 / R_XTENSA_SLOT0_OP relocation application.
# Off by default so the base linked-executable loader stays dependency-light.
reloc = ["dep:lp-xt-inst"]

[dependencies]
lp-xt-emu = { path = "../lp-xt-emu" }
lp-xt-inst = { path = "../lp-xt-inst", optional = true }
object = { version = "0.36", default-features = false, features = ["read", "std", "elf"] }

[dev-dependencies]
lp-xt-inst = { path = "../lp-xt-inst" }
